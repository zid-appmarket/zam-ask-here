name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests scripts

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest

      # Every change to knowledge/ changes what the bot may say, so the
      # documents are validated like code.
      - name: Validate the knowledge base
        run: python scripts/ingest.py --validate --list
