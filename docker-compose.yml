# Local / single-host deployment.
#
#   cp .env.example .env     # then fill it in
#   docker compose up --build
#
# Socket Mode needs no inbound port. For SLACK_MODE=http, uncomment `ports`
# and put a TLS terminator in front of it.

services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overridden here so they always point at the mounted volume.
      DATABASE_URL: sqlite:////data/zam_agent.db
      KNOWLEDGE_SNAPSHOT_PATH: /data/knowledge_index.json
    volumes:
      # Durable: losing this re-posts answers after a restart.
      - agent-data:/data
      # Mount the knowledge base read-only so the container cannot alter it.
      - ./knowledge:/app/knowledge:ro
    # ports:
    #   - "3000:3000"   # SLACK_MODE=http only
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  agent-data:
